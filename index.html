<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10141C">
<title>NEXUS</title>
<style>
:root{--bg:#10141C;--s1:#181F2B;--s2:#222B39;--ac:#38BDF8;--ac2:#2DD4BF;--tx:#F1F5F9;--tx2:#94A3B8;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--bd:#2c3748}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;min-height:100vh}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#side{width:236px;background:var(--s1);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-weight:800;letter-spacing:.14em;font-size:20px;padding:4px 10px 2px;color:var(--ac)}
.tag{color:var(--tx2);font-size:12px;padding:0 10px 14px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--tx2)}
.nav:hover{background:var(--s2);color:var(--tx)}
.nav.on{background:var(--s2);color:var(--ac);font-weight:600}
.nav[aria-disabled=true]{opacity:.45;cursor:default}
.nav[aria-disabled=true]:hover{background:none;color:var(--tx2)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);padding:14px 10px 4px}
#main{flex:1;padding:24px 28px 60px;max-width:1100px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--tx2);margin:0 0 18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.grow{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.k{color:var(--tx2);font-size:12px}
.v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}.mut{color:var(--tx2)}
.btn{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:#06202e;border-color:var(--ac);font-weight:600}
.btn.sm{padding:3px 8px;font-size:13px}
.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
.bar input,.bar select{width:auto}
label{display:block;font-size:13px;color:var(--tx2);margin-bottom:10px}
label input,label select,label textarea{margin-top:3px;color:var(--tx)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--tx2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd)}
td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{overflow-x:auto}
.badge{display:inline-block;font-size:11px;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--tx2)}
.badge.est{border-color:var(--warn);color:var(--warn)}
.prog{height:8px;background:var(--s2);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.prog>i{display:block;height:100%;background:var(--ac2)}
.prog.w>i{background:var(--warn)}.prog.b>i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.leg{font-size:12px;color:var(--tx2);display:flex;gap:14px;margin-top:6px}
.empty{color:var(--tx2);padding:18px;text-align:center}
dialog{background:var(--s1);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:20px;width:min(480px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.err{color:var(--bad);min-height:18px;font-size:13px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.note{font-size:13px;color:var(--tx2);border-left:3px solid var(--warn);padding:4px 10px;margin:10px 0}
@media(max-width:820px){
 body{flex-direction:column}
 #side{width:100%;height:auto;position:sticky;top:0;z-index:5;display:flex;flex-wrap:nowrap;overflow-x:auto;padding:8px;gap:2px;align-items:center;border-right:0;border-bottom:1px solid var(--bd)}
 .logo,.tag,.sec{display:none}
 .nav{width:auto;white-space:nowrap}
 .nav[aria-disabled=true]{display:none}
 #main{padding:16px 14px 60px}
}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:5px 13px;cursor:pointer}
.tab[aria-pressed=true]{border-color:var(--ac);color:var(--ac);font-weight:600}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calh{font-size:12px;color:var(--tx2);text-align:center;padding:4px}
.calcell{background:var(--s1);border:1px solid var(--bd);border-radius:8px;min-height:96px;padding:4px;cursor:pointer;overflow:hidden}
.calcell.out{opacity:.45}.calcell.tod{border-color:var(--ac)}
.dn{font-size:12px;color:var(--tx2);margin-bottom:2px}
.calcell.tod .dn{color:var(--ac);font-weight:700}
.chip{font-size:11px;border-left:3px solid;padding:0 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--s2);border-radius:3px}
.cnt{display:none;font-size:11px;color:var(--ac)}
.citem{display:block;width:100%;text-align:left;background:var(--s2);border:0;border-left:4px solid;border-radius:6px;padding:6px 9px;margin-bottom:6px;cursor:pointer}
.citem:hover{background:#2b3648}
.ico{display:inline-block;min-width:1.2em}
@media(max-width:820px){.calcell{min-height:52px}.chip{display:none}.cnt{display:inline}}
@media print{:root{--bg:#fff;--s1:#fff;--s2:#f1f1f1;--tx:#000;--tx2:#444;--bd:#bbb}#side,.noprint,dialog{display:none!important}body{display:block}#main{max-width:none;padding:0}.card{break-inside:avoid}}
</style>
</head>
<body>
<nav id="side" aria-label="Navegación principal"></nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<dialog id="dlg2" style="width:min(400px,92vw)"></dialog>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const crc = n => (n < 0 ? '-' : '') + '₡' + Math.abs(Math.round(n)).toLocaleString('es-CR');
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const monthOf = s => s.slice(0, 7);
const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number); return ymd(new Date(y, mo - 1 + d, 1)).slice(0, 7); };
const monthLabel = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('es-CR', { month: 'long', year: 'numeric' }); };
const monthShort = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('es-CR', { month: 'short' }).replace('.', ''); };
const dayLabel = s => new Date(s + 'T00:00:00').toLocaleDateString('es-CR', { day: 'numeric', month: 'short', year: 'numeric' });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const opt = (v, cur, label) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label ?? v)}</option>`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);

/* ---------- base de datos local (IndexedDB) ---------- */
const STORES = ['accounts', 'transactions', 'categories', 'budgets', 'settings', 'events', 'tasks', 'projects', 'jobs', 'edu', 'docs'];
let db;
const S = { accounts: [], transactions: [], categories: [], budgets: [], settings: [] };
let CFG;

function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('nexus', 2);
    r.onupgradeneeded = () => STORES.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const store = (n, mode = 'readonly') => db.transaction(n, mode).objectStore(n);
const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const live = n => S[n].filter(x => !x.deleted_at);

async function save(name, obj) {
  const now = new Date().toISOString();
  if (!obj.id) obj.id = uuid();
  if (!obj.created_at) obj.created_at = now;
  obj.updated_at = now;
  obj.version = (obj.version || 0) + 1;
  await reqP(store(name, 'readwrite').put(obj));
  const i = S[name].findIndex(x => x.id === obj.id);
  if (i >= 0) S[name][i] = obj; else S[name].push(obj);
  return obj;
}
async function removeRec(name, id) {
  const o = S[name].find(x => x.id === id);
  if (!o) return;
  o.deleted_at = new Date().toISOString(); // tombstone, listo para sincronizar en el futuro
  await save(name, o);
}

const DEF_EXP = ['Alimentación','Transporte','Vivienda','Servicios públicos','Educación','Salud','Tecnología','Entretenimiento','Higiene personal','Compras','Deudas','Otros'];
const DEF_INC = ['Salario','Servicios profesionales','Ventas','Comisiones','Aguinaldo','Bonificaciones','Apoyo económico','Otros'];

async function boot() {
  db = await openDB();
  for (const n of STORES) S[n] = await reqP(store(n).getAll());
  if (!S.categories.length) {
    for (const n of DEF_EXP) await save('categories', { name: n, type: 'gasto', active: true });
    for (const n of DEF_INC) await save('categories', { name: n, type: 'ingreso', active: true });
  }
  if (!S.accounts.length) await save('accounts', { name: 'Efectivo', institution: '', type: 'efectivo', initial: 0, active: true, currency: 'CRC' });
  CFG = S.settings.find(x => x.id === 'main');
  if (!CFG) CFG = await save('settings', { id: 'main', plan: {} });
  normCfg();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

/* ---------- cálculos financieros (deterministas) ---------- */
const accName = id => (S.accounts.find(a => a.id === id) || {}).name || '—';
const catName = id => (S.categories.find(c => c.id === id) || {}).name || 'Sin categoría';
function balance(accId) {
  const a = S.accounts.find(x => x.id === accId);
  let b = a ? (a.initial || 0) : 0;
  for (const t of live('transactions')) {
    if (t.status !== 'confirmado') continue; // pendientes no afectan saldos
    if (t.type === 'ingreso' && t.account === accId) b += t.amount;
    else if (t.type === 'gasto' && t.account === accId) b -= t.amount;
    else if (t.type === 'ajuste' && t.account === accId) b += t.amount;
    else if (t.type === 'transferencia') { if (t.account === accId) b -= t.amount; if (t.toAccount === accId) b += t.amount; }
  }
  return b;
}
const activeAccs = () => live('accounts').filter(a => a.active !== false);
const disponible = () => activeAccs().filter(a => a.type !== 'tarjeta de crédito').reduce((s, a) => s + balance(a.id), 0);
const deudaTarjetas = () => activeAccs().filter(a => a.type === 'tarjeta de crédito').reduce((s, a) => s + Math.min(0, balance(a.id)), 0);
function monthStats(m) {
  let inc = 0, exp = 0;
  for (const t of live('transactions')) if (t.status === 'confirmado' && monthOf(t.date) === m) {
    if (t.type === 'ingreso') inc += t.amount; else if (t.type === 'gasto') exp += t.amount;
  }
  return { inc, exp };
}
function spentByCat(m) {
  const r = {};
  for (const t of live('transactions')) if (t.type === 'gasto' && t.status === 'confirmado' && monthOf(t.date) === m) r[t.category || ''] = (r[t.category || ''] || 0) + t.amount;
  return r;
}
const pendingOut = () => live('transactions').filter(t => t.type === 'gasto' && t.status === 'pendiente').reduce((s, t) => s + t.amount, 0);

/* ---------- interfaz ---------- */
const ui = { view: 'dashboard', month: monthOf(today()), f: { q: '', type: '', account: '', cat: '' } };
const NAV = [
  ['dashboard', 'Dashboard'], ['movimientos', 'Movimientos'], ['cuentas', 'Cuentas'], ['presupuestos', 'Presupuestos'],
  ['sinsalario', 'Planificación sin salario'], ['calendario', 'Calendario'], ['tareas', 'Tareas'], ['objetivos', 'Objetivos y proyectos'],
  ['independencia', 'Independencia'], ['empleo', 'Empleo'], ['educacion', 'Educación'], ['reportes', 'Reportes'], ['documentos', 'Documentos'],
  ['config', 'Configuración']
];

function renderNav() {
  $('#side').innerHTML = `<div class="logo">NEXUS</div><div class="tag">Organiza tu presente.</div>` +
    NAV.map(([k, l]) => `<button class="nav${ui.view === k ? ' on' : ''}" data-act="go" data-v="${k}"${ui.view === k ? ' aria-current="page"' : ''}>${l}</button>`).join('') +
    '';
}
function render() {
  renderNav();
  const v = { dashboard: vDashboard, movimientos: vMovs, cuentas: vAccounts, presupuestos: vBudgets, sinsalario: vPlan, config: vConfig, calendario: vCalendar, tareas: vTasks, objetivos: vProjects, independencia: vIndep, empleo: vJobs, educacion: vEdu, reportes: vReports, documentos: vDocs }[ui.view] || vDashboard;
  $('#main').innerHTML = v();
  const s = $('#main [data-focus]'); if (s) { s.focus(); }
}
const monthBar = () => `<div class="bar"><button class="btn sm" data-act="mprev" aria-label="Mes anterior">‹</button><strong style="min-width:150px;text-align:center">${cap(monthLabel(ui.month))}</strong><button class="btn sm" data-act="mnext" aria-label="Mes siguiente">›</button><button class="btn sm" data-act="mnow">Hoy</button></div>`;
const amtCls = t => t.type === 'ingreso' ? 'pos' : t.type === 'gasto' ? 'neg' : 'mut';
const amtTxt = t => t.type === 'ingreso' ? '+' + crc(t.amount) : t.type === 'gasto' ? '−' + crc(t.amount) : t.type === 'ajuste' ? (t.amount >= 0 ? '+' : '−') + crc(Math.abs(t.amount)) : crc(t.amount);

function barChart(months) {
  const data = months.map(m => ({ m, ...monthStats(m) }));
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.exp]));
  const W = 520, H = 170, pad = 14, bw = 15, step = (W - 2 * pad) / data.length;
  let s = `<svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Ingresos frente a gastos de los últimos meses">`;
  data.forEach((d, i) => {
    const x = pad + i * step + (step - 2 * bw - 3) / 2, h1 = d.inc / max * H, h2 = d.exp / max * H;
    s += `<rect x="${x}" y="${H - h1}" width="${bw}" height="${Math.max(h1, d.inc ? 2 : 0)}" fill="#22C55E" rx="2"><title>Ingresos ${crc(d.inc)}</title></rect>`;
    s += `<rect x="${x + bw + 3}" y="${H - h2}" width="${bw}" height="${Math.max(h2, d.exp ? 2 : 0)}" fill="#EF4444" rx="2"><title>Gastos ${crc(d.exp)}</title></rect>`;
    s += `<text x="${x + bw + 1}" y="${H + 16}" text-anchor="middle" fill="#94A3B8" font-size="11">${esc(monthShort(d.m))}</text>`;
  });
  s += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#2c3748"/></svg>`;
  return s + `<div class="leg"><span><b class="pos">■</b> Ingresos</span><span><b class="neg">■</b> Gastos</span></div>`;
}
function catBars(m) {
  const sp = spentByCat(m), tot = Object.values(sp).reduce((a, b) => a + b, 0);
  const rows = Object.entries(sp).sort((a, b) => b[1] - a[1]);
  if (!rows.length) return `<div class="empty">Sin gastos confirmados este mes.</div>`;
  return rows.map(([id, v]) => { const p = Math.round(v / tot * 100); return `<div><div class="row"><span>${esc(catName(id))}</span><span class="mut">${crc(v)} · ${p} %</span></div><div class="prog"><i style="width:${p}%"></i></div></div>`; }).join('');
}

function vDashboard() {
  const st = monthStats(ui.month), net = st.inc - st.exp, debt = deudaTarjetas();
  const months = []; for (let i = 5; i >= 0; i--) months.push(shiftMonth(ui.month, -i));
  const buds = live('budgets'), sp = spentByCat(ui.month);
  const recent = live('transactions').slice().sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at)).slice(0, 8);
  return `<h1>Dashboard</h1><p class="sub">Tu situación al día de hoy. Solo los movimientos confirmados afectan los saldos.</p>${monthBar()}
  <div class="grid">
   <div class="card"><div class="k">Saldo disponible</div><div class="v ${disponible() < 0 ? 'neg' : ''}">${crc(disponible())}</div></div>
   <div class="card"><div class="k">Ingresos del mes</div><div class="v pos">${crc(st.inc)}</div></div>
   <div class="card"><div class="k">Gastos del mes</div><div class="v neg">${crc(st.exp)}</div></div>
   <div class="card"><div class="k">Ahorro neto del mes</div><div class="v ${net < 0 ? 'neg' : 'pos'}">${net < 0 ? '−' : ''}${crc(Math.abs(net))}</div></div>
   <div class="card"><div class="k">Gastos pendientes de pago</div><div class="v wrn">${crc(pendingOut())}</div></div>
   ${debt ? `<div class="card"><div class="k">Deuda en tarjetas</div><div class="v neg">${crc(debt)}</div></div>` : ''}
  </div>
  <div class="grid2">
   <div class="card"><h2>Ingresos frente a gastos</h2>${barChart(months)}</div>
   <div class="card"><h2>Gastos por categoría</h2>${catBars(ui.month)}</div>
  </div>
  <div class="grid2">
   <div class="card"><h2>Presupuestos</h2>${buds.length ? buds.map(b => budRow(b, sp[b.category] || 0)).join('') : `<div class="empty">Aún no tienes presupuestos.</div>`}</div>
   <div class="card"><h2>Actividad reciente</h2>${recent.length ? `<table>${recent.map(t => `<tr><td>${esc(t.description || (t.type === 'transferencia' ? accName(t.account) + ' → ' + accName(t.toAccount) : cap(t.type)))}<div class="mut" style="font-size:12px">${dayLabel(t.date)}${t.status === 'pendiente' ? ' · pendiente' : ''}</div></td><td class="num ${amtCls(t)}">${amtTxt(t)}</td></tr>`).join('')}</table>` : `<div class="empty">Registra tu primer movimiento en “Movimientos”.</div>`}</div>
  </div>${dashAgenda()}`;
}

/* ---- movimientos ---- */
function filteredTx() {
  const f = ui.f, q = f.q.trim().toLowerCase();
  return live('transactions').filter(t => monthOf(t.date) === ui.month && (!f.type || t.type === f.type) && (!f.account || t.account === f.account || t.toAccount === f.account) && (!f.cat || t.category === f.cat) &&
    (!q || ((t.description || '') + ' ' + (t.notes || '') + ' ' + (t.tags || []).join(' ')).toLowerCase().includes(q)))
    .sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
}
function vMovs() {
  const list = filteredTx(), f = ui.f;
  const inc = list.filter(t => t.type === 'ingreso' && t.status === 'confirmado').reduce((s, t) => s + t.amount, 0);
  const exp = list.filter(t => t.type === 'gasto' && t.status === 'confirmado').reduce((s, t) => s + t.amount, 0);
  return `<h1>Movimientos</h1><p class="sub">Ingresos, gastos, transferencias y ajustes de saldo.</p>${monthBar()}
  <div class="bar">
   <input data-f="q" placeholder="Buscar…" value="${esc(f.q)}" aria-label="Buscar" style="min-width:160px" ${f.q ? 'data-focus' : ''}>
   <select data-f="type" aria-label="Tipo"><option value="">Todos los tipos</option>${['ingreso', 'gasto', 'transferencia', 'ajuste'].map(x => opt(x, f.type, cap(x))).join('')}</select>
   <select data-f="account" aria-label="Cuenta"><option value="">Todas las cuentas</option>${live('accounts').map(a => opt(a.id, f.account, a.name)).join('')}</select>
   <select data-f="cat" aria-label="Categoría"><option value="">Todas las categorías</option>${live('categories').map(c => opt(c.id, f.cat, c.name)).join('')}</select>
   <span class="grow"></span><button class="btn pri" data-act="newtx">+ Nuevo movimiento</button>
  </div>
  <div class="card wrap">${list.length ? `<table><thead><tr><th>Fecha</th><th>Descripción</th><th>Cuenta</th><th>Categoría</th><th class="num">Monto</th><th></th></tr></thead><tbody>${list.map(t => `<tr>
   <td>${dayLabel(t.date)}</td>
   <td>${esc(t.description || cap(t.type))}${t.status === 'pendiente' ? ' <span class="badge est">pendiente</span>' : ''}${(t.tags || []).map(x => ` <span class="badge">${esc(x)}</span>`).join('')}</td>
   <td>${t.type === 'transferencia' ? esc(accName(t.account)) + ' → ' + esc(accName(t.toAccount)) : esc(accName(t.account))}</td>

let dlg2Res = null;
function dlg2(msg, buttons) {
  return new Promise(res => {
    const d = $('#dlg2');

    d.innerHTML = `<p style="margin-top:0">${esc(msg)}</p><div class="acts">${buttons}</div>`;

const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

function openForm(title, body, onSave, onOpen) {
  const d = $('#dlg');
  // El guardado NO depende del envío del formulario (algunos visores lo bloquean): botón normal + Enter manual.
  d.innerHTML = `<form id="frm" novalidate><h2>${esc(title)}</h2>${body}<div class="err" role="alert"></div><div class="acts"><button type="button" class="btn" data-act="close">Cancelar</button><button type="button" class="btn pri" data-act="save">Guardar</button></div></form>`;
  const form = $('#frm');
  form.onsubmit = e => e.preventDefault();
  let busy = false;
  formSave = async () => {
    if (busy) return;
    const errEl = $('.err', d);
    errEl.textContent = '';
    if (!form.checkValidity()) { const bad = form.querySelector(':invalid'); errEl.textContent = 'Revisa el campo: ' + ((bad.closest('label') || {}).textContent || '').trim().split('\n')[0].slice(0, 60); bad.focus(); return; }
    busy = true;
    try {
      const err = await onSave(new FormData(form));
      if (err) { errEl.textContent = err; return; }
      d.close(); render();
    } catch (x) { errEl.textContent = 'Error al guardar: ' + x.message; }
    finally { busy = false; }
  };
  form.onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file' && e.target.type !== 'checkbox') { e.preventDefault(); formSave(); } };
  d.showModal();
  if (onOpen) onOpen(d);
}

/* ---- planificación sin salario ---- */
function planCalc() {
  const p = CFG.plan, t0 = today();
  const start = p.startBalance !== '' && p.startBalance != null ? Number(p.startBalance) : disponible();
  const monthlyEss = p.essentials.reduce((a, e) => a + e.monthly, 0);
  const daily = monthlyEss * 12 / 365, reserve = Number(p.reserve) || 0;
  const extrasUpTo = d => p.extras.filter(e => { const o = daysBetween(t0, e.date); return o >= 0 && o <= d; }).reduce((a, e) => a + e.amount, 0);
  const scenario = hire => {
    const days = Math.max(0, daysBetween(t0, hire)) + (Number(p.payLag) || 0);
    const extras = extrasUpTo(days), end = start - daily * days - extras;
    const maxWeekly = days > 0 ? (start - reserve - extras) / (days / 7) : null;
    return { days, extras, end, maxWeekly, status: end >= reserve ? 'ok' : end >= 0 ? 'warn' : 'bad' };
  };
  let runway = null;
  if (daily > 0 || p.extras.length) for (let d = 0; d <= 1825; d++) { if (start - daily * d - extrasUpTo(d) < 0) { runway = d; break; } }
  return { start, monthlyEss, weeklyEss: monthlyEss * 12 / 52, daily, reserve, scenario, runway };
}

function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['fecha', 'tipo', 'descripcion', 'monto_crc', 'cuenta', 'cuenta_destino', 'categoria', 'estado', 'etiquetas', 'notas']];
  live('transactions').slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.type, t.description, t.amount, accName(t.account), t.toAccount ? accName(t.toAccount) : '', t.category ? catName(t.category) : '', t.status, (t.tags || []).join(';'), t.notes]));
  download('nexus-movimientos.csv', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
async function importJSON(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'nexus' || !j.data) return tell('El archivo no es un respaldo de NEXUS.');
    if (!(await askConfirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?', 'Restaurar'))) return;
    for (const n of STORES) { await reqP(store(n, 'readwrite').clear()); for (const o of (j.data[n] || [])) { await reviveBlob(o); await reqP(store(n, 'readwrite').put(o)); } S[n] = await reqP(store(n).getAll()); }
    CFG = S.settings.find(x => x.id === 'main') || await save('settings', { id: 'main', plan: {} });
    normCfg();
    render(); tell('Respaldo restaurado.');
  } catch (e) { tell('No se pudo leer el respaldo: ' + e.message); }
}

function fieldHtml(f, v) {
  const val = v ?? f.d ?? '';
  const req = f.req ? ' required' : '';
  if (f.t === 'select') {
    const os = typeof f.o === 'function' ? f.o() : f.o;
    return `<label>${f.l}<select name="${f.n}">${f.blank != null ? opt('', val, f.blank) : ''}${os.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, cap(o)]; return opt(ov, val, ol); }).join('')}</select></label>`;
  }
  if (f.t === 'textarea') return `<label>${f.l}<textarea name="${f.n}" rows="2">${esc(val)}</textarea></label>`;
  if (f.t === 'tags') return `<label>${f.l}<input name="${f.n}" value="${esc(Array.isArray(val) ? val.join(', ') : val)}"></label>`;
  if (f.t === 'number') return `<label>${f.l}<input name="${f.n}" type="number" step="1"${f.min != null ? ' min="' + f.min + '"' : ''} value="${esc(val)}" inputmode="numeric"${req}></label>`;
  return `<label>${f.l}<input name="${f.n}" type="${f.t || 'text'}" value="${esc(val)}"${req}></label>`;
}
function crud(storeName, title, fields, rec, opts = {}) {
  rec = rec || {};
  const isNew = !rec.id;
  const del = !isNew && opts.delAct ? `<div style="margin-bottom:10px"><button type="button" class="btn sm dng" data-act="${opts.delAct}" data-id="${rec.id}">Borrar este registro</button></div>` : '';
  openForm((isNew ? 'Nuevo: ' : 'Editar: ') + title, fields.map(f => fieldHtml(f, rec[f.n])).join('') + del, fd => {
    const o = Object.assign({}, rec);
    for (const f of fields) {
      let v = fd.get(f.n);
      if (f.t === 'number') {
        v = v === '' || v == null ? null : Math.round(Number(v));
        if (v !== null && !Number.isFinite(v)) return 'Número inválido: ' + f.l;
        if (v !== null && f.min != null && v < f.min) return f.l + ' no puede ser menor que ' + f.min + '.';
      } else if (f.t === 'tags') v = (v || '').split(',').map(x => x.trim()).filter(Boolean);
      else v = (v || '').trim();
      if (f.req && (v === '' || v == null)) return 'Completa: ' + f.l;
      o[f.n] = v;
    }
    if (opts.post) { const e = opts.post(o); if (e) return e; }
    return save(storeName, o).then(() => null);
  });
}

/* ---------- calendario ---------- */
function occursOn(ev, d) {
  if (!ev.date || d < ev.date) return false;
  if (ev.until && d > ev.until) return false;
  switch (ev.repeat) {
    case 'diaria': return true;
    case 'semanal': return daysBetween(ev.date, d) % 7 === 0;
    case 'mensual': return d.slice(8) === ev.date.slice(8);
    case 'anual': return d.slice(5) === ev.date.slice(5);
    default: return d === ev.date;
  }
}
function calItems(d) {
  const r = [];
  live('events').forEach(e => { if (occursOn(e, d)) r.push({ k: 'evento', t: e.title, time: e.time || '', id: e.id, ed: 'editev', sub: cap(e.type || 'evento') + (e.prio === 'alta' ? ' · prioridad alta' : '') + (e.repeat && e.repeat !== 'ninguna' ? ' · se repite (' + e.repeat + ')' : '') }); });
  live('tasks').forEach(t => { if (t.due === d && !['completada', 'cancelada'].includes(t.estado)) r.push({ k: 'tarea', t: t.name, time: '', id: t.id, ed: 'edittask', sub: 'Tarea · ' + t.estado }); });
  live('transactions').forEach(t => { if (t.status === 'pendiente' && t.date === d && (t.type === 'gasto' || t.type === 'ingreso')) r.push({ k: 'pago', t: (t.type === 'gasto' ? 'Pagar: ' : 'Cobrar: ') + (t.description || '') + ' ' + crc(t.amount), time: '', id: t.id, ed: 'edittx', sub: 'Movimiento pendiente' }); });
  live('jobs').forEach(j => { if (j.nextDate === d && !FINAL_JOB.includes(j.estado)) r.push({ k: 'empleo', t: j.empresa + ': ' + (j.nextAction || 'próxima acción'), time: '', id: j.id, ed: 'editjob', sub: 'Empleo · ' + j.estado }); });
  live('docs').forEach(x => { if (x.venc === d) r.push({ k: 'doc', t: 'Vence: ' + x.name, time: '', id: x.id, ed: 'editdoc', sub: 'Documento · ' + x.type }); });
  live('edu').forEach(x => { if (x.kind === 'fecha' && x.date === d) r.push({ k: 'edu', t: x.title, time: '', id: x.id, ed: 'editedu', sub: 'Educación · ' + (x.tipo || '') }); });
  live('projects').forEach(p => { if (p.target === d && p.estado === 'activo') r.push({ k: 'meta', t: 'Meta: ' + p.name, time: '', id: p.id, ed: 'editproj', sub: 'Objetivo' }); });
  const mv = CFG.indep && CFG.indep.move;
  if (mv && mv.fecha === d) r.push({ k: 'mudanza', t: 'Mudanza' + (mv.destino ? ' a ' + mv.destino : ''), time: '', id: '', ed: 'gotoind', sub: 'Independencia', data: 'data-t="mudanza"' });
  return r.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
const itemBtn = it => `<button class="citem" style="border-left-color:${KIND[it.k][2]}" data-act="${it.ed}" ${it.id ? 'data-id="' + it.id + '"' : ''} ${it.data || ''}><b class="ico" aria-hidden="true">${KIND[it.k][0]}</b> ${it.time ? esc(it.time) + ' · ' : ''}${esc(it.t)}<div class="mut" style="font-size:12px">${esc(it.sub || KIND[it.k][1])}</div></button>`;

function alerts() {
  const t0 = today(), r = [];
  live('tasks').forEach(t => {
    if (!t.due || ['completada', 'cancelada'].includes(t.estado)) return;
    const n = daysBetween(t0, t.due);
    if (n < 0) r.push({ lvl: 'bad', t: 'Tarea vencida: ' + t.name, n });
    else if (t.remind != null && t.remind !== '' && n <= t.remind) r.push({ lvl: 'warn', t: 'Tarea: ' + t.name, n });
  });
  live('events').forEach(e => {
    if (e.remind == null || e.remind === '') return;
    for (let k = 0; k <= e.remind; k++) if (occursOn(e, addDays(t0, k))) { r.push({ lvl: 'warn', t: 'Evento: ' + e.title, n: k }); break; }
  });
  live('docs').forEach(x => {
    if (!x.venc) return;
    const n = daysBetween(t0, x.venc);
    if (n < 0) r.push({ lvl: 'bad', t: 'Documento vencido: ' + x.name, n }); else if (n <= 30) r.push({ lvl: 'warn', t: 'Documento por vencer: ' + x.name, n });
  });
  live('transactions').forEach(x => {
    if (x.status !== 'pendiente' || x.type !== 'gasto') return;
    const n = daysBetween(t0, x.date);
    if (n < 0) r.push({ lvl: 'bad', t: 'Pago atrasado: ' + (x.description || 'gasto') + ' ' + crc(x.amount), n }); else if (n <= 7) r.push({ lvl: 'warn', t: 'Pago próximo: ' + (x.description || 'gasto') + ' ' + crc(x.amount), n });
  });
  live('jobs').forEach(j => {
    if (!j.nextDate || FINAL_JOB.includes(j.estado)) return;
    const n = daysBetween(t0, j.nextDate);
    if (n < 0) r.push({ lvl: 'bad', t: 'Empleo, acción atrasada: ' + j.empresa, n }); else if (n <= 3) r.push({ lvl: 'warn', t: 'Empleo: ' + j.empresa + ' · ' + (j.nextAction || 'próxima acción'), n });
  });
  return r.sort((a, b) => a.n - b.n);
}
function dashAgenda() {

    const d = addDays(t0, i), its = calItems(d);
    if (its.length) up += `<div style="margin-bottom:6px"><div class="k">${i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : dayLabel(d)}</div>${its.map(it => `<div><span class="ico" style="color:${KIND[it.k][2]}" aria-hidden="true">${KIND[it.k][0]}</span> ${esc(it.t)} ${it.time ? '<span class="mut">' + esc(it.time) + '</span>' : ''}</div>`).join('')}</div>`;
  }
  const pend = live('tasks').filter(t => !['completada', 'cancelada'].includes(t.estado)).length;
  return `<div class="grid2">
   <div class="card"><h2>Alertas</h2>${al.length ? al.map(a => `<div class="row" style="margin-bottom:4px"><span class="${a.lvl === 'bad' ? 'neg' : 'wrn'}"><b aria-hidden="true">${a.lvl === 'bad' ? '✖' : '▲'}</b> ${esc(a.t)}</span><span class="mut">${whenTxt(a.n)}</span></div>`).join('') : '<div class="empty">Sin alertas. Todo al día.</div>'}</div>

}

function projProgress(p) {
  const ts = live('tasks').filter(t => t.project === p.id && t.estado !== 'cancelada'), st = p.stages || [], tot = ts.length + st.length;
  if (!tot) return Math.min(100, p.progress || 0);

const inp = (path, label, val, type = 'number') => `<label>${label}<input type="${type}" ${type === 'number' ? 'step="any" min="0" inputmode="decimal"' : ''} data-ind="${path}" value="${val === '' || val == null ? '' : esc(val)}"></label>`;
function indepCalc() {
  const I = CFG.indep, s = I.sim, mv = I.move, n = v => Number(v) || 0;
  const bruto = n(s.bruto), deduc = Math.round(bruto * n(s.deduc)) / 100;
  const neto = s.neto !== '' && s.neto != null ? n(s.neto) : Math.round(bruto - deduc);
  const viv = Object.values(I.housing).reduce((a, b) => a + n(b), 0), uni = n(s.uni), gastos = viv + uni, margen = neto - gastos;
  const pend = I.items.filter(x => !x.bought).reduce((a, x) => a + n(x.price), 0);
  const mob = I.items.length ? pend : n(mv.mobiliario);
  const inicial = n(mv.transporte) + n(mv.mudanza) + n(mv.deposito) + n(mv.alquiler1) + n(mv.instalacion) + mob;
  const emerg = Math.round(gastos * n(s.emerg));
  const ahorros = s.ahorros !== '' && s.ahorros != null ? n(s.ahorros) : disponible();
  const req = inicial + emerg, brecha = ahorros - req;
  let riesgo = 'bajo';
  if (neto <= 0 || margen < 0 || ahorros < inicial) riesgo = 'alto'; else if (margen < neto * 0.15 || ahorros < req) riesgo = 'medio';
  return { bruto, deduc, neto, viv, uni, gastos, margen, mob, inicial, emerg, ahorros, req, brecha, riesgo, meses: brecha < 0 && margen > 0 ? Math.ceil(-brecha / margen) : null, ahorroMes: Math.round(neto * n(s.ahorroPct) / 100) };
}

function rangeFor(mode, d, from, to) {
  if (mode === 'dia') return [d, d];
  if (mode === 'semana') { const a = mondayOf(d); return [a, addDays(a, 6)]; }
  if (mode === 'mes') { const m = monthOf(d); return [m + '-01', lastDayOf(m)]; }
  if (mode === 'trimestre') { const y = Number(d.slice(0, 4)), q = Math.floor((Number(d.slice(5, 7)) - 1) / 3); return [ymd(new Date(y, q * 3, 1)), ymd(new Date(y, q * 3 + 3, 0))]; }
  if (mode === 'año') { const y = d.slice(0, 4); return [y + '-01-01', y + '-12-31']; }
  return from <= to ? [from, to] : [to, from];
}
const shiftRep = (mode, d, k) => mode === 'dia' ? addDays(d, k) : mode === 'semana' ? addDays(d, 7 * k) : mode === 'mes' ? shiftMonth(monthOf(d), k) + '-01' : mode === 'trimestre' ? shiftMonth(monthOf(d), 3 * k) + '-01' : (Number(d.slice(0, 4)) + k) + '-01-01';
function statsRange(a, b) {
  let inc = 0, exp = 0, n = 0; const cx = {}, ci = {};
  live('transactions').forEach(t => {
    if (t.status !== 'confirmado' || t.date < a || t.date > b) return;
    if (t.type === 'ingreso') { inc += t.amount; ci[t.category || ''] = (ci[t.category || ''] || 0) + t.amount; n++; }
    else if (t.type === 'gasto') { exp += t.amount; cx[t.category || ''] = (cx[t.category || ''] || 0) + t.amount; n++; }
  });
  return { inc, exp, net: inc - exp, cx, ci, n };
}
function prevRange(r) {
  const m = ui.rep.mode;
  if (m === 'custom') { const len = daysBetween(r[0], r[1]) + 1; return [addDays(r[0], -len), addDays(r[0], -1)]; }
  return rangeFor(m, shiftRep(m, ui.rep.date, -1));
}
function buckets(a, b) {
  const days = daysBetween(a, b) + 1, out = [];
  if (days <= 31) for (let i = 0; i < days; i++) { const d = addDays(a, i), s = statsRange(d, d); out.push({ label: String(Number(d.slice(8))), inc: s.inc, exp: s.exp }); }
  else for (let m = monthOf(a); m <= monthOf(b); m = shiftMonth(m, 1)) { const lo = m + '-01' > a ? m + '-01' : a, hi = lastDayOf(m) < b ? lastDayOf(m) : b, s = statsRange(lo, hi); out.push({ label: monthShort(m), inc: s.inc, exp: s.exp }); }
  return out;
}
function barChartB(data) {

  let s = `<svg viewBox="0 0 ${W} ${H + 24}" width="100%" role="img" aria-label="Ingresos frente a gastos del período">`;
  data.forEach((d, i) => {
    const x = pad + i * step + (step - 2 * bw - 2) / 2, h1 = d.inc / max * H, h2 = d.exp / max * H;
    s += `<rect x="${x}" y="${H - h1}" width="${bw}" height="${Math.max(h1, d.inc ? 2 : 0)}" fill="#22C55E" rx="1"><title>${esc(d.label)}: ingresos ${crc(d.inc)}</title></rect><rect x="${x + bw + 2}" y="${H - h2}" width="${bw}" height="${Math.max(h2, d.exp ? 2 : 0)}" fill="#EF4444" rx="1"><title>${esc(d.label)}: gastos ${crc(d.exp)}</title></rect>`;
    if (data.length <= 16 || i % Math.ceil(data.length / 12) === 0) s += `<text x="${x + bw}" y="${H + 16}" text-anchor="middle" fill="#94A3B8" font-size="10">${esc(d.label)}</text>`;
  });
  return s + `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#2c3748"/></svg><div class="leg"><span><b class="pos">■</b> Ingresos</span><span><b class="neg">■</b> Gastos</span></div>`;
}
const pctVar = (cur, prev) => prev ? Math.round((cur - prev) / prev * 100) : null;
const varTxt = (cur, prev, goodUp) => { const p = pctVar(cur, prev); if (p === null) return '<span class="mut">sin período previo</span>'; const up = p > 0, good = p === 0 ? null : (up === goodUp); return `<span class="${good === null ? 'mut' : good ? 'pos' : 'neg'}">${up ? '▲' : p < 0 ? '▼' : '='} ${Math.abs(p)} % vs. período anterior</span>`; };

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
function dataURLToBlob(u) {

}
async function reviveBlob(o) { if (o && o.blobIsData && typeof o.blob === 'string') { o.blob = dataURLToBlob(o.blob); delete o.blobIsData; } }
async function exportJSON() {
  const data = {};
  for (const n of STORES) data[n] = await Promise.all(S[n].map(async o => (o.blob instanceof Blob) ? Object.assign({}, o, { blob: await blobToDataURL(o.blob), blobIsData: true }) : o));
  download('nexus-respaldo-' + today() + '.json', JSON.stringify({ app: 'nexus', version: 2, exported_at: new Date().toISOString(), data }, null, 1), 'application/json');
}

    const [st, id, fld] = t.dataset.sf.split(':'), o = S[st].find(x => x.id === id); if (!o) return true;
    o[fld] = t.value;
    if (st === 'jobs') markInterview(o);
    if (st === 'tasks') o.doneAt = o.estado === 'completada' ? new Date().toISOString() : null;
    await save(st, o); render(); return true;
  }
  if (t.dataset.ind) {
    const v = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value;
    setPath(CFG.indep, t.dataset.ind, v); await save('settings', CFG); render(); return true;
  }
  if (t.dataset.uf) { if (t.type === 'text' || t.type === 'search') return true; setPath(ui.uf, t.dataset.uf, t.value); render(); return true; }
  if (t.dataset.rep) { ui.rep[t.dataset.rep] = t.value; render(); return true; }

}

    case 'delext': CFG.plan.extras.splice(i, 1); await savePlan(); render(); break;
    case 'expjson': await exportJSON(); break;
    case 'expcsv': exportCSV(); break;
    case 'togcat': { const c = byId('categories', id); c.active = c.active === false; await save('categories', c); render(); break; }
    case 'newcat': openForm('Nueva categoría', `<label>Nombre<input name="name" required></label><label>Tipo<select name="type"><option value="gasto">Gasto</option><option value="ingreso">Ingreso</option></select></label>`,
      fd => { const name = (fd.get('name') || '').trim(); if (!name) return 'Escribe un nombre.'; return save('categories', { name, type: fd.get('type'), active: true }).then(() => null); }); break;
    case 'wipe': if (await askConfirm('Se borrarán TODOS los datos de este navegador. ¿Seguro?', 'Continuar') && await askConfirm('Última confirmación: ¿borrar todo? No se puede deshacer.', 'Borrar todo')) { for (const n of STORES) await reqP(store(n, 'readwrite').clear()); location.reload(); } break;
    default: await moduleClick(a, el, id, i);
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (await moduleChange(t)) return;
  if (t.dataset.f) { ui.f[t.dataset.f] = t.value; render(); }
  else if (t.dataset.p) { CFG.plan[t.dataset.p] = t.type === 'number' && t.value !== '' ? Number(t.value) : t.value; await savePlan(); render(); }
  else if (t.dataset.act === 'impjson' && t.files[0]) { await importJSON(t.files[0]); t.value = ''; }
});
document.addEventListener('input', e => { if (e.target.dataset.f === 'q') { ui.f.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('[data-f=q]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (NAV.some(n => n[0] === v) && v !== ui.view) { ui.view = v; render(); } });

boot().then(() => { const v = location.hash.slice(1); if (NAV.some(n => n[0] === v)) ui.view = v; render(); })
  .catch(err => { $('#main').innerHTML = '<h1>No se pudo abrir la base de datos local</h1><p class="mut">' + esc(err.message) + '</p><p class="mut">Si abres el archivo en modo privado o desde un visor que bloquea el almacenamiento, ábrelo en una ventana normal del navegador.</p>'; });
</script>
